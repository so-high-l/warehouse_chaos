name: Warehouse_chaos CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry==2.5

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run pytest

      - name: Check linting
        run: poetry run ruff check .

      - name: Check formatting
        run: poetry run ruff format --check .
